# iOS build on a GitHub-hosted macOS runner (free for public repositories), on every pull request
# and push to main that touches the iOS app. Unsigned and without secrets, so pull requests from
# forks run it safely. Signing and TestFlight uploads never run here; they run from the deployment
# repository.
name: ios

on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: HarinaKit tests
        run: swift test --package-path ios/HarinaKit
      - name: Generate the Xcode project
        run: brew install xcodegen && cd ios && xcodegen
      - name: Build for the simulator (unsigned)
        run: |
          cd ios
          xcodebuild -project Harina.xcodeproj -scheme Harina \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
