# Public CI: GitHub-hosted runners only, no secrets, never deploys.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (ESLint, no hardcoded text, locale parity)
        run: npm run lint
      - name: iOS strings exist for every key the app uses
        run: node scripts/check-ios-strings.js
      - name: Tests
        run: npm test

  ios-logic:
    # HarinaKit is Foundation only, so it builds and tests on Linux for free on every PR.
    # The runner image no longer ships Swift, so the job runs in the official Swift image.
    runs-on: ubuntu-latest
    container: swift:6.0.3-jammy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --package-path ios/HarinaKit

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (whole history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --redact --no-banner

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off (DCO)
        run: scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
