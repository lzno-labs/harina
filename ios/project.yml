# XcodeGen spec (https://github.com/yonaskolb/XcodeGen). Generate the project with:
#   brew install xcodegen && cd ios && xcodegen
# The .xcodeproj is generated, never committed.
name: Harina
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  HarinaKit:
    path: HarinaKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Harina:
    type: application
    platform: iOS
    sources:
      - path: Harina
    dependencies:
      - package: HarinaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HARINA_BUNDLE_ID)
        PRODUCT_NAME: harina
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Harina
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Harina/Info.plist
      properties:
        CFBundleDevelopmentRegion: es
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.lzno.harina.sync]
        # harina://link?server=…&code=… from the web's QR (always confirmed in the app).
        CFBundleURLTypes:
          - CFBundleURLName: harina-link
            CFBundleURLSchemes: [harina]
        NSFaceIDUsageDescription: $(HARINA_FACE_ID_TEXT)
        # iCloud link of a ready-made capture shortcut for this build (empty: manual steps).
        HarinaShortcutURL: $(HARINA_SHORTCUT_URL)
schemes:
  Harina:
    build:
      targets:
        Harina: all
    test:
      targets: []
